pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "NagramX"
include ':TMessagesProj'

gradle.ext.androidxMediaModulePrefix = 'TMessagesProj_Modules:media3:media-'
def androidxMediaRoot = file("TMessagesProj_Modules/media")
gradle.ext.androidxMediaSettingsDir = androidxMediaRoot.getCanonicalPath()
def androidxMediaLibraries = [
        'common', 'container', 'database', 'datasource', 'decoder', 'extractor',
        'exoplayer', 'exoplayer_dash', 'exoplayer_hls', 'decoder_ffmpeg', 'session',
        'effect', 'muxer', 'transformer', 'inspector', 'inspector_frame',
]
/* media disabled */